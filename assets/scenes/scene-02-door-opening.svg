<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d4655" />
      <stop offset="100%" stop-color="#141a24" />
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#272d37" />
      <stop offset="100%" stop-color="#0e131a" />
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7a563f" />
      <stop offset="100%" stop-color="#4b3326" />
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffdca0" stop-opacity="0.92" />
      <stop offset="45%" stop-color="#f7c87a" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#f7c87a" stop-opacity="0" />
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.04" /></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#wall)" />
  <rect y="620" width="1600" height="280" fill="url(#floor)" />
  <polygon points="688,150 966,205 962,772 686,800" fill="url(#door)" />
  <polygon points="688,150 807,205 804,760 686,800" fill="#30241b" />
  <polygon points="804,205 1162,156 1142,790 802,760" fill="url(#beam)" />
  <ellipse cx="1000" cy="520" rx="280" ry="120" fill="#f5cb83" opacity="0.12" />
  <rect width="1600" height="900" filter="url(#grain)" />
</svg>
