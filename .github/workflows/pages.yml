# Deploy static game to GitHub Pages.
# One-time: Repo → Settings → Pages → Build and deployment → Source: GitHub Actions
# Site URL: https://danielmdavis.github.io/call-the-senator/

name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site (no .git / dev-only files in artifact)
        run: |
          mkdir -p _site
          cp index.html game.js styles.css _site/
          cp -R assets _site/
          : > _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
