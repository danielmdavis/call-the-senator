<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Call the Senator</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./assets/favicon.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <aside class="controls-panel" aria-label="Game controls">
        <button id="restart-button" type="button">Restart</button>
        <button
          id="toggle-hitbox-button"
          type="button"
          aria-pressed="false"
        >
          Toggle Hitbox
        </button>
        <button
          id="toggle-keys-flags-button"
          type="button"
          aria-pressed="false"
        >
          Toggle Keys &amp; Flags
        </button>
      </aside>

      <section class="scene-frame" aria-live="polite">
        <img id="scene-image" src="" alt="" />
        <div id="fin-credits" class="fin-credits" hidden aria-hidden="true">
          <p class="fin-credits__title">CALL THE SENATOR</p>
          <p class="fin-credits__byline">
            an ai slop by Daniel Davis, 2026
          </p>
        </div>
        <div id="hotspot-layer"></div>
        <div
          id="keys-flags-overlay"
          class="keys-flags-overlay"
          aria-hidden="true"
        ></div>
      </section>

      <aside class="caption-panel" aria-live="polite">
        <p id="scene-caption"></p>
      </aside>
    </main>

    <script src="./game.js"></script>
  </body>
</html>
